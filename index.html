<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="stylesheet" href="styles.css">
<title>Texture Extractor</title>
</head>
<body>
  <div id="app">
    <div class="controls">
      <label class="filepill">
        Select .blend (big files supported)
        <input id="file" type="file" accept=".blend" />
      </label>
      <div id="status">No file selected</div>
    </div>

    <div id="progressWrap" aria-hidden="true">
      <progress id="progress" value="0" max="100"></progress>
      <div id="progressText"></div>
    </div>

    <div id="results" class="grid"></div>
  </div>

<script type="module">
const fileInput = document.getElementById('file');
const status = document.getElementById('status');
const progress = document.getElementById('progress');
const progressText = document.getElementById('progressText');
const progressWrap = document.getElementById('progressWrap');
const results = document.getElementById('results');

const worker = new Worker('worker.js');

let currentFile = null;
let foundRanges = []; // {start,end,type}

worker.onmessage = (e) => {
  const msg = e.data;
  if (msg.type === 'progress') {
    progressWrap.hidden = false;
    progress.value = msg.percent;
    progressText.textContent = msg.text || '';
  } else if (msg.type === 'found') {
    // add range
    foundRanges.push(msg.range);
    addResultItem(msg.range);
  } else if (msg.type === 'done') {
    progressWrap.hidden = true;
    status.textContent = `Finished scan — ${foundRanges.length} assets found.`;
  } else if (msg.type === 'status') {
    status.textContent = msg.text;
  }
};

fileInput.addEventListener('change', async (ev) => {
  results.innerHTML = '';
  foundRanges = [];
  const f = ev.target.files[0];
  if (!f) return;
  currentFile = f;
  status.textContent = `Queuing ${f.name} (${(f.size/1024/1024).toFixed(1)} MB)`;
  // Start scanning: we'll stream via slices to worker
  const CHUNK = 4 * 1024 * 1024; // 4MB chunks
  const total = f.size;
  worker.postMessage({cmd:'reset'});
  let offset = 0;
  while (offset < total) {
    const end = Math.min(offset + CHUNK, total);
    const blob = f.slice(offset, end);
    const buffer = await blob.arrayBuffer();
    worker.postMessage({cmd:'chunk', chunk:buffer, offset}, [buffer]);
    offset = end;
    const percent = Math.floor((offset/total)*100);
    worker.postMessage({cmd:'progressRequest', percent});
  }
  worker.postMessage({cmd:'finish'});
});

function addResultItem(range) {
  // create preview + download using File.slice
  const el = document.createElement('div');
  el.className = 'item';
  const thumb = document.createElement('div');
  thumb.className = 'thumb';
  const info = document.createElement('div');
  info.className = 'meta';
  const name = document.createElement('div');
  name.className = 'fname';
  name.textContent = `${range.type} — ${range.end - range.start} bytes`;
  const btns = document.createElement('div');
  btns.className = 'btns';
  const dl = document.createElement('a');
  dl.className = 'btn';
  dl.textContent = 'Download';
  const previewBtn = document.createElement('button');
  previewBtn.className = 'btn';
  previewBtn.textContent = 'Preview';

  btns.appendChild(previewBtn);
  btns.appendChild(dl);
  info.appendChild(name);
  info.appendChild(btns);
  el.appendChild(thumb);
  el.appendChild(info);
  results.appendChild(el);

  // create blob URL for download and preview
  const blob = currentFile.slice(range.start, range.end);
  const ext = extForType(range.type);
  const filename = `${currentFile.name}.${range.start}-${range.end}.${ext}`;
  const url = URL.createObjectURL(blob);
  dl.href = url;
  dl.download = filename;

  // preview (image)
  previewBtn.addEventListener('click', () => {
    const w = window.open('', '_blank');
    if (!w) return;
    if (isImageType(range.type)) {
      w.document.body.style.margin = '0';
      w.document.body.style.background = '#111';
      const img = w.document.createElement('img');
      img.src = url;
      img.style.maxWidth = '100%';
      img.style.maxHeight = '100vh';
      w.document.body.appendChild(img);
    } else {
      w.document.body.textContent = `Preview not available for ${range.type}`;
    }
  });

  // inline thumbnail (if image)
  if (isImageType(range.type)) {
    const img = document.createElement('img');
    img.src = url;
    img.alt = range.type;
    thumb.appendChild(img);
  } else {
    thumb.textContent = range.type;
  }
}

function isImageType(t) {
  return ['PNG','JPEG','GIF','BMP'].includes(t);
}
function extForType(t) {
  if (t === 'PNG') return 'png';
  if (t === 'JPEG') return 'jpg';
  if (t === 'GIF') return 'gif';
  if (t === 'BMP') return 'bmp';
  return 'bin';
}
</script>
</body>
</html>
